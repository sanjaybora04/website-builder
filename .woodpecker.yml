pipeline:
  build-frontend:
    image: docker
    commands:
      - docker build -t localhost:5000/service-a:latest ./service-a
      - docker push localhost:5000/service-a:latest

  build-backend:
    image: docker
    commands:
      - docker build -t localhost:5000/service-b:latest ./service-b
      - docker push localhost:5000/service-b:latest

