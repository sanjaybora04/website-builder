pipeline:
  build-frontend:
    image: docker
    commands:
      - docker build -t localhost:5000/website-builder-frontend:latest ./backend
      - docker push localhost:5000/website-builder-frontend:latest

  build-backend:
    image: docker
    commands:
      - docker build -t localhost:5000/website-builder-backend:latest ./backend
      - docker push localhost:5000/website-builder-backend:latest

