pipeline:
  build-frontend:
    image: moby/buildkit:rootless
    volumes:
      - /run/buildkit:/run/buildkit
    commands:
      - buildctl --addr unix:///run/buildkit/buildkitd.sock build \
          --frontend dockerfile.v0 \
          --local context=./frontend \
          --local dockerfile=./frontend/Dockerfile \
          --output type=docker,name=website-builder-frontend:latest

  build-backend:
    image: moby/buildkit:rootless
    volumes:
      - /run/buildkit:/run/buildkit
    commands:
      - buildctl --addr unix:///run/buildkit/buildkitd.sock build \
          --frontend dockerfile.v0 \
          --local context=./backend \
          --local dockerfile=./backend/Dockerfile \
          --output type=docker,name=website-builder-backend:latest


