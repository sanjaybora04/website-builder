when:
  event:
    - push

pipeline:
  build-frontend:
    image: docker
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    commands:
      - |
        docker build \
          --build-arg NEXT_PUBLIC_GOOGLE_OAUTH_CLIENT_ID=143876800064-2dp99jo42u5dmb7avteco297m13b276a.apps.googleusercontent.com \
          --build-arg NEXT_PUBLIC_API_URL=https://api.sanjaybora.in \
          --build-arg NEXT_PUBLIC_BASE_URL=https://sitecraft.sanjaybora.in \
          --build-arg NEXT_PUBLIC_S3_URL='https://s3.sanjaybora.in' \
          --build-arg NEXT_PUBLIC_SERVER_IP='82.29.161.181' \
          -t website-builder-frontend:latest ./frontend
  
  build-backend:
    image: docker
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    commands:
      - docker build -t website-builder-backend:latest ./backend

  redeploy:
    image: docker
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    commands:
      - docker service update --force website-builder_frontend
      - docker service update --force website-builder_backend

  cleanup:
    image: docker
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    commands:
      - docker container prune -f
      - docker image prune -af