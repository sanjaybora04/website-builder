when:
  event:
    - push

pipeline:
  build-frontend:
    image: docker
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    commands:
      - docker build -t website-builder-frontend:latest ./frontend
  
  build-backend:
    image: docker
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    commands:
      - docker build -t website-builder-backend:latest ./backend

  redeploy:
    image: docker
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    commands:
      - docker service update --force website-builder_frontend
      - docker service update --force website-builder_backend

  cleanup:
    image: docker
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    commands:
      - docker container prune -f
      - docker image prune -af