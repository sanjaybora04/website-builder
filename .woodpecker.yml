pipeline:
  build-frontend:
    image: docker
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    commands:
      - docker build -t website-builder-frontend:latest ./frontend

  build-backend:
    image: docker
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    commands:
      - docker build -t website-builder-backend:latest ./backend

